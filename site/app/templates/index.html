<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Gen - Procedural Planet Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: {
                            750: '#2d3748',
                            850: '#1a202c',
                            950: '#0d1117',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Custom Scrollbar for a modern look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        input[type=range] {
            accent-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 h-screen overflow-hidden flex font-sans antialiased selection:bg-blue-500/30">

    <!-- Sidebar UI -->
    <aside class="w-[340px] h-screen overflow-y-auto bg-gray-900/95 backdrop-blur-md p-6 flex flex-col gap-6 z-10 shadow-[4px_0_24px_rgba(0,0,0,0.8)] border-r border-gray-800 relative">
        <!-- Logo Area -->
        <div class="flex items-center gap-3 border-b border-gray-800 pb-4">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-purple-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21.128 12A10.011 10.011 0 0112 21.997 10.011 10.011 0 012.872 12 10.011 10.011 0 0112 2.003 10.011 10.011 0 0121.128 12z"></path></svg>
            </div>
            <div>
                <h1 class="text-xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400 tracking-wide">World Gen</h1>
                <p class="text-xs text-gray-400 font-medium">Procedural Planet Engine</p>
            </div>
        </div>

        <div class="flex flex-col gap-5 flex-1">

            <!-- Main Seed Input (Always visible) -->
            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50 shadow-inner">
                <label class="block text-sm font-semibold text-gray-300 mb-2 flex justify-between">
                    <span>Planet Seed</span>
                    <button id="randomSeedBtn" class="text-blue-400 hover:text-blue-300 transition-colors" title="Randomize">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </label>
                <input type="number" id="seed" value="67" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2.5 text-white outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all font-mono text-lg shadow-sm">
            </div>

            <!-- Generate Button -->
            <button id="generateBtn" class="w-full relative group overflow-hidden bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-[0_0_15px_rgba(37,99,235,0.4)] hover:shadow-[0_0_25px_rgba(37,99,235,0.6)] transform active:scale-95">
                <span class="relative z-10 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Generate World
                </span>
                <div class="absolute inset-0 h-full w-full bg-gradient-to-r from-blue-600 via-purple-600 to-blue-600 opacity-0 group-hover:opacity-100 transition-opacity duration-500 bg-[length:200%_auto] animate-gradient"></div>
            </button>

            <!-- Advanced Settings Accordion -->
            <div class="mt-2 border border-gray-700/60 rounded-xl bg-gray-800/30 overflow-hidden backdrop-blur-sm">
                <button type="button" id="advancedToggle" class="w-full flex justify-between items-center px-4 py-3.5 text-sm font-semibold text-gray-300 hover:text-white hover:bg-gray-700/50 transition-colors outline-none focus:ring-2 focus:ring-inset focus:ring-gray-600">
                    <span class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        Advanced Settings
                    </span>
                    <svg id="advancedIcon" class="w-4 h-4 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>

                <div id="advancedContent" class="hidden px-4 pb-4 flex-col gap-4 max-h-[40vh] overflow-y-auto">
                    <!-- Base Shape -->
                    <div class="pt-2 border-t border-gray-700">
                        <h4 class="text-xs uppercase text-gray-500 font-bold mb-3 tracking-wider">Base Shape</h4>
                        <div class="space-y-3">
                            <div>
                                <label class="flex justify-between text-xs mb-1 text-gray-400"><span>Radius</span> <span id="radiusLabel">3</span></label>
                                <input type="range" id="radius" min="1" max="50" value="3" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                                <input type="hidden" id="radiusNum" value="3">
                            </div>

                            <div>
                                <label class="flex justify-between text-xs mb-1 text-gray-400"><span>Subdivisions (1-8)</span> <span id="subLabel">6</span></label>
                                <input type="range" id="subdivisions" min="1" max="8" value="6" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                                <input type="hidden" id="subdivisionsNum" value="6">
                            </div>
                        </div>
                    </div>

                    <!-- Tectonics -->
                    <div class="pt-3 border-t border-gray-700">
                        <h4 class="text-xs uppercase text-gray-500 font-bold mb-3 tracking-wider">Tectonics</h4>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] mb-1 text-gray-400">Plate Iterations</label>
                                <input type="number" id="plate_iterations" value="4" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-sm text-white outline-none focus:border-blue-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-[11px] mb-1 text-gray-400">Plate Count</label>
                                <input type="number" id="plate_count" value="40" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-sm text-white outline-none focus:border-blue-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-[11px] mb-1 text-gray-400">Range Radius</label>
                                <input type="number" step="0.1" id="range_radius" value="10" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-sm text-white outline-none focus:border-blue-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-[11px] mb-1 text-gray-400">Range Amp</label>
                                <input type="number" step="0.1" id="range_amplitude" value="1" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-sm text-white outline-none focus:border-blue-500 transition-colors">
                            </div>
                        </div>
                    </div>

                    <!-- Noise / Micro-relief -->
                    <div class="pt-3 border-t border-gray-700">
                        <h4 class="text-xs uppercase text-gray-500 font-bold mb-3 tracking-wider">3D Noise (fBm)</h4>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="col-span-2">
                                <label class="block text-[11px] mb-1 text-gray-400">Noise Scale</label>
                                <input type="number" step="0.1" id="noise_scale" value="1" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-sm text-white outline-none focus:border-blue-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-[11px] mb-1 text-gray-400">Octaves</label>
                                <input type="number" id="octaves" value="5" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-sm text-white outline-none focus:border-blue-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-[11px] mb-1 text-gray-400">Persistence</label>
                                <input type="number" step="0.1" id="persistence" value="0.4" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-sm text-white outline-none focus:border-blue-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-[11px] mb-1 text-gray-400">Lacunarity</label>
                                <input type="number" step="0.1" id="lacunarity" value="2" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-sm text-white outline-none focus:border-blue-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-[11px] mb-1 text-gray-400">Amplitude</label>
                                <input type="number" step="0.1" id="amplitude" value="30" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-sm text-white outline-none focus:border-blue-500 transition-colors">
                            </div>
                        </div>
                    </div>

                    <!-- Environment -->
                    <div class="pt-3 border-t border-gray-700">
                        <h4 class="text-xs uppercase text-gray-500 font-bold mb-3 tracking-wider">Environment</h4>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] mb-1 text-gray-400">Water Level</label>
                                <input type="number" step="0.01" id="water_level" value="0.325" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-sm text-white outline-none focus:border-blue-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-[11px] mb-1 text-gray-400">Sharpness Str</label>
                                <input type="number" step="0.1" id="sharpness_strength" value="4" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-sm text-white outline-none focus:border-blue-500 transition-colors">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Status Footer -->
        <div class="mt-auto bg-gray-800/40 p-4 rounded-xl border border-gray-800 backdrop-blur-md">
            <div class="flex items-center gap-2 mb-1">
                <div id="statusIndicator" class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Engine Status</h3>
            </div>
            <div id="statusText" class="text-sm font-medium text-gray-200 mt-1 pl-4 border-l-2 border-gray-700">Ready to generate.</div>
        </div>
    </aside>

    <!-- 3D Canvas Container -->
    <main class="flex-1 relative cursor-grab active:cursor-grabbing bg-gradient-to-br from-gray-950 via-black to-gray-900" id="canvas-container">
        <!-- Three.js canvas will be injected here -->

        <!-- Optional overlay UI -->
        <div class="absolute bottom-6 right-6 flex items-center gap-2 px-4 py-2 bg-gray-900/60 backdrop-blur-md rounded-full border border-gray-800 text-xs text-gray-400 shadow-xl pointer-events-none">
            <span>Drag to rotate</span>
            <span>&bull;</span>
            <span>Scroll to zoom</span>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module" src="{{ url_for('static', filename='js/scene.js') }}?v=4"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}?v=4"></script>
</body>
</html>
